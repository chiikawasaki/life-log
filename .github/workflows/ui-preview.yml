name: UI preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.*'
      - 'playwright.config.*'
      - 'tests/e2e/**'
      - '.github/workflows/ui-preview.yml'

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Screenshots and browser tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      before: ${{ steps.before-test.outcome }}
      after: ${{ steps.after-test.outcome }}
      artifact: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            before/package-lock.json
            after/package-lock.json
      - name: Capture base commit
        id: before-test
        working-directory: before
        continue-on-error: true
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Capture and test head commit
        id: after-test
        working-directory: after
        continue-on-error: true
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload before and after screenshots
        id: upload
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-before-after
          path: |
            before/test-results/**/*.png
            after/test-results/**/*.png
            before/test-results/**/trace.zip
            after/test-results/**/trace.zip
            before/test-results/**/error-context.md
            after/test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize results
        if: ${{ !cancelled() }}
        env:
          BEFORE: ${{ steps.before-test.outcome }}
          AFTER: ${{ steps.after-test.outcome }}
          ARTIFACT: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '## UI画面確認'
            echo
            echo "- 修正前（PC・スマートフォン）: ${BEFORE:-not run}"
            echo "- 修正後（PC・スマートフォン）: ${AFTER:-not run}"
            if [ -n "$ARTIFACT" ]; then
              echo "- [画像と失敗時の詳細（14日間）]($ARTIFACT)"
            else
              echo '- 画像のArtifactを取得できませんでした。実行ログを確認してください。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$AFTER" = success

  report:
    name: Post PR summary
    needs: preview
    if: ${{ !cancelled() && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.preview.outputs.artifact != ''
        continue-on-error: true
        with:
          name: ui-before-after
          path: screenshots
      - uses: actions/github-script@v7
        env:
          BEFORE: ${{ needs.preview.outputs.before }}
          AFTER: ${{ needs.preview.outputs.after }}
          ARTIFACT: ${{ needs.preview.outputs.artifact }}
        with:
          script: |
            const marker = '<!-- life-log-ui-preview -->';
            const pull = context.payload.pull_request;
            const repo = context.repo;
            const current = await github.rest.pulls.get({ ...repo, pull_number: pull.number });
            if (current.data.head.sha !== pull.head.sha || current.data.state !== 'open') return;

            const run = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const result = (value) => ({ success: '成功', failure: '失敗', cancelled: '中止', skipped: '未実施' })[value] ?? '未実施';
            const artifact = process.env.ARTIFACT;
            const images = [];
            const files = [];
            const screens = ['home', 'login', 'history', 'rules', 'reflection', 'level-up', 'goals-home', 'goals'];
            if (!context.payload.repository.private) {
              try {
                const fs = require('node:fs/promises');
                for (const revision of ['before', 'after']) {
                  const dir = `screenshots/${revision}/test-results`;
                  for (const entry of await fs.readdir(dir, { withFileTypes: true }).catch(() => [])) {
                    const device = entry.name.match(/-(desktop|mobile)$/)?.[1];
                    if (!entry.isDirectory() || !device) continue;
                    for (const screen of screens) {
                      const source = `${dir}/${entry.name}/${screen}.png`;
                      const data = await fs.readFile(source).catch(() => null);
                      if (!data || !data.subarray(0, 8).equals(Buffer.from('89504e470d0a1a0a', 'hex'))) continue;
                      const path = `${revision}/${device}/${screen}.png`;
                      const blob = await github.rest.git.createBlob({ ...repo, content: data.toString('base64'), encoding: 'base64' });
                      files.push({ path, sha: blob.data.sha, mode: '100644', type: 'blob' });
                    }
                  }
                }
                if (files.length) {
                  const tree = await github.rest.git.createTree({ ...repo, tree: files });
                  const commit = await github.rest.git.createCommit({
                    ...repo, message: `UI screenshots for PR #${pull.number}`, tree: tree.data.sha, parents: [],
                  });
                  const ref = `heads/ui-screenshots/pr-${pull.number}`;
                  try {
                    await github.rest.git.getRef({ ...repo, ref });
                    await github.rest.git.updateRef({ ...repo, ref, sha: commit.data.sha, force: true });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                    await github.rest.git.createRef({ ...repo, ref: `refs/${ref}`, sha: commit.data.sha });
                  }
                  const host = `https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${commit.data.sha}`;
                  const labels = ['ホーム', 'ログイン', '履歴', '行動ルール', '振り返り', 'レベルアップ', '目標のホーム表示', '目標'];
                  const cell = (revision, device, screen) => {
                    const path = `${revision}/${device}/${screen}.png`;
                    if (!files.some((file) => file.path === path)) return '画像なし';
                    return `<a href="${host}/${path}"><img src="${host}/${path}" width="280" alt="${revision} ${device} ${screen}"></a>`;
                  };
                  for (const [device, title] of [['desktop', 'PC'], ['mobile', 'スマートフォン']]) {
                    images.push('<details' + (device === 'desktop' ? ' open' : '') + '>', `<summary>${title}の画面比較</summary>`, '',
                      '| 画面 | 修正前 | 修正後 |', '| --- | --- | --- |');
                    for (const [index, screen] of screens.entries()) {
                      images.push(`| ${labels[index]} | ${cell('before', device, screen)} | ${cell('after', device, screen)} |`);
                    }
                    images.push('', '</details>', '');
                  }
                }
              } catch (error) {
                core.warning(`Could not publish inline screenshots: ${error.message}`);
              }
            }

            const body = [
              marker,
              '## UI画面確認',
              '',
              '| 対象 | コミット | Playwright（PC・スマートフォン） |',
              '| --- | --- | --- |',
              `| 修正前 | \`${pull.base.sha.slice(0, 7)}\` | ${result(process.env.BEFORE)} |`,
              `| 修正後 | \`${pull.head.sha.slice(0, 7)}\` | ${result(process.env.AFTER)} |`,
              '',
              ...images,
              artifact
                ? `[スクリーンショットをダウンロード（14日間）](${artifact})（元画像・失敗時の詳細）。`
                : 'スクリーンショットのArtifactがありません。',
              `[実行ログ](${run})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number: pull.number });
            const previous = comments.find((item) => item.user?.login === 'github-actions[bot]' && item.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number: pull.number, body });
            }


  cleanup:
    name: Remove published screenshot branch
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ref = `heads/ui-screenshots/pr-${context.payload.pull_request.number}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref });
              await github.rest.git.deleteRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
